name: sejin

services:
  postgres:
    image: postgres:16-alpine
    container_name: sejin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sejin_dev
      POSTGRES_PASSWORD: sejin_dev_password
      POSTGRES_DB: sejin_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sejin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sejin_dev -d sejin_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sejin_postgres_data:
